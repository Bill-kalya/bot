[project]
name = "trading-bot"
version = "0.2.0"
description = "News-driven BTC futures research platform (demo-first)"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]